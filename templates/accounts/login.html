{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 4rem auto;">
    <h2 style="text-align: center; margin-bottom: 2rem;">Login</h2>
    <form method="post">
        {% csrf_token %}
        
        <div style="margin-bottom: 1rem;">
            <input 
                type="text" 
                name="username" 
                placeholder="Enter your username" 
                class="form-control"
                style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem;"
                required
            >
        </div>

        <div style="margin-bottom: 1rem;">
            <input 
                type="password" 
                name="password" 
                placeholder="Enter your password" 
                class="form-control"
                style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem;"
                required
            >
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Login</button>
    </form>
    <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
        Don't have an account? <a href="{% url 'register' %}" style="color: var(--accent);">Register</a><br>
        <a href="{% url 'password_reset' %}" style="color: var(--primary);">Forgot Password?</a>
    </p>
</div>
{% endblock %}
