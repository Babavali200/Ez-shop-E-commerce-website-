{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 4rem auto; text-align: center;">
    <div style="font-size: 3rem; margin-bottom: 1rem;">📧</div>
    <h2 style="margin-bottom: 0.5rem;">Check Your Email</h2>
    <p style="color: #666; font-size: 0.95rem; line-height: 1.6; margin-bottom: 2rem;">
        If an account with that email exists, we've sent a password reset link. 
        Please check your inbox (and your spam folder just in case).
    </p>
    <a href="{% url 'login' %}" class="btn btn-primary" style="display: inline-block; padding: 0.8rem 2rem;">
        Back to Login
    </a>
</div>
{% endblock %}
