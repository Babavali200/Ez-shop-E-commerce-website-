{% extends 'base.html' %}
{% block content %}
<div class="auth-card card">
    <div class="auth-icon">✅</div>
    <h2 class="auth-title">Password Reset Successful</h2>
    <p class="auth-msg">
        Your password has been set. You can now log in with your new password.
    </p>
    <a href="{% url 'login' %}" class="btn btn-primary auth-btn">
        Log In Now
    </a>
</div>

<style>
    .auth-card {
        max-width: 420px; 
        margin: 4rem auto; 
        text-align: center;
    }
    .auth-icon {
        font-size: 3rem; 
        margin-bottom: 1rem;
    }
    .auth-title {
        margin-bottom: 0.5rem;
    }
    .auth-msg {
        color: #666; 
        font-size: 0.95rem; 
        line-height: 1.6; 
        margin-bottom: 2rem;
    }
    .auth-btn {
        display: inline-block; 
        padding: 0.8rem 2rem;
    }

    @media (max-width: 480px) {
        .auth-card {
            margin: 2rem auto;
            padding: 1.5rem !important;
        }
    }
</style>
{% endblock %}
