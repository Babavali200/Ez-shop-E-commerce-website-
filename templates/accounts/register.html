{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 4rem auto;">
    <h2 style="text-align: center; margin-bottom: 2rem;">Register</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Register</button>
    </form>
    <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
        Already have an account? <a href="{% url 'login' %}" style="color: var(--accent);">Login</a>
    </p>
</div>
{% endblock %}
