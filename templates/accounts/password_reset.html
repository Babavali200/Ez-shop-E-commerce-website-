{% extends 'base.html' %}
{% block content %}
<div class="auth-card card">
    <h2 style="text-align: center; margin-bottom: 0.5rem;">Forgot Password</h2>
    <p style="text-align: center; color: #666; font-size: 0.9rem; margin-bottom: 2rem;">
        Enter your email address and we'll send you a reset link.
    </p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary submit-btn">
            Send Reset Link
        </button>
    </form>
    <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
        Remembered it? <a href="{% url 'login' %}" style="color: var(--primary); font-weight: 600;">Back to Login</a>
    </p>
</div>

<style>
    .auth-card {
        max-width: 420px; 
        margin: 4rem auto;
    }
    .submit-btn {
        width: 100%; 
        margin-top: 1rem; 
        padding: 0.8rem;
    }
    @media (max-width: 480px) {
        .auth-card {
            margin: 2rem auto;
            padding: 1.5rem !important;
        }
    }
</style>
{% endblock %}
