{% extends 'base.html' %}
{% block content %}
<div class="product-form-card card">
    <h2 style="margin-bottom: 2rem;">{% if edit %}Edit Product{% else %}Add New Product{% endif %}</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-grid">
            {% for field in form %}
                <div class="form-group">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="field-error">
                            {{ field.errors }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary submit-btn">
                {% if edit %}Update Product{% else %}Save Product{% endif %}
            </button>
        </div>
    </form>
</div>

<style>
    .product-form-card {
        max-width: 600px; 
        margin: 2rem auto;
    }
    .form-grid {
        display: flex; 
        flex-direction: column; 
        gap: 1rem;
    }
    .form-label {
        display: block; 
        margin-bottom: 0.5rem; 
        font-weight: 600;
    }
    .field-error {
        color: var(--accent); 
        font-size: 0.8rem; 
        margin-top: 0.3rem;
    }
    .submit-btn {
        margin-top: 1rem; 
        padding: 1rem;
    }

    @media (max-width: 768px) {
        .product-form-card {
            margin: 1rem auto;
            padding: 1.5rem !important;
        }
    }
</style>

<script>
    // Style inputs automatically
    document.querySelectorAll('input:not([type="file"]):not([type="checkbox"]), select, textarea').forEach(el => {
        el.classList.add('form-control');
    });
</script>
{% endblock %}
